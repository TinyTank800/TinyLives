lives:
  endless: # Used for anyone with the tinylives.endless tag.
    enabled: false # Disables the use of endless lives.
    prefix: "&8*Endless*"
    color: '&8'
    world: # If you would like to force players in this life to a specific world.
      enabled: false
      world: The_Endless # World name IS CASE SENSITIVE!
    pvp: # If you want to enable pvp settings for this life.
      enabled: false # This will not disable pvp just disable the control of start and fight back
      startpvp: true # Can start a pvp session with a player
      fightback: true # Can fight back when a session is started
    on-death: # On death settings. Only triggered when you die on this life
      disable-commands: true
      disable-tp: true
      commands: # Run console commands. Placeholder api supported
        - say hi
      tp: # Tp to location.
        x: 100
        y: 100
        z: 100
